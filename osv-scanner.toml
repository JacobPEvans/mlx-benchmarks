# OSV Scanner config — local override for JacobPEvans/mlx-benchmarks.
#
# The reusable workflow at JacobPEvans/.github/.github/workflows/_osv-scan.yml
# auto-applies this file when present (otherwise it falls back to the org-wide
# default at JacobPEvans/.github/osv-scanner.toml).
#
# Each ignored vulnerability MUST:
#   1. Link to a tracking issue in this repo.
#   2. Set ignoreUntil (max ~6 months) — forces a quarterly review.
#   3. Document the reason and the actual exploitability surface.
#
# This is per-CVE acknowledgement, not a blanket disable. New findings still
# fail the build.

[[IgnoredVulns]]
id = "GHSA-q9r5-6hrr-9ph7"
ignoreUntil = 2026-08-07
reason = """
smolagents 1.22.0 (CVSS 10.0). The fix shipped in 1.24.0, but smolagents 1.23.0+
added huggingface-hub<1.0.0 as a hard upper-bound, which is incompatible with
the project's huggingface-hub>=0.23 dependency (currently resolved to 1.14.0).
Upgrading smolagents would force a major huggingface-hub downgrade, regressing a
core library. Blocked until smolagents adds support for huggingface-hub v1.x.

Tracked in: https://github.com/JacobPEvans/mlx-benchmarks/issues/35
Re-evaluate before 2026-08-07 (or sooner if smolagents adds hub v1.x support).
"""

