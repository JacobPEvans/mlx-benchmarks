[[IgnoredVulns]]
id = "GHSA-g4r7-86gm-pgqc"
ignoreUntil = 2026-10-25
reason = """
sqlitedict 2.1.0 (CVE-2024-35515) — insecure deserialization of binary-
encoded data in .sqlite files. Pulled in transitively by
lm-eval[api]==0.4.11 (lm-eval's required dep, not optional). The project
is dormant; no fix released and none expected on the 2.x line.

Exploitability in our usage: the dep is loaded only by lm-eval's local
caching layer for benchmark runs against models we control on
hardware we control. There is no untrusted input path.

Tracked in: https://github.com/JacobPEvans/mlx-benchmarks/issues/18
Re-evaluate before 2026-10-25 (or sooner if lm-eval drops sqlitedict).
"""

[[IgnoredVulns]]
id = "PYSEC-2024-274"
ignoreUntil = 2026-11-20
reason = """
gradio 6.14.0 (CVSS 9.8) — CVE-2024-39236 / GHSA-9v2f-6vcg-3hgv. Code
injection in /gradio/component_meta.py via crafted input. The upstream
supplier formally DISPUTES the advisory: "the report is about a user
attacking himself" — the attack surface is the user crafting input for
their own Space.

We use gradio only as the Space frontend for benchmark visualisation.
The Space accepts no user-controlled metadata input that reaches
component_meta.py. Already on latest published (6.14.0); no fix
expected since upstream considers this non-issue.

Tracked in: https://github.com/JacobPEvans/mlx-benchmarks/issues/43
Re-evaluate before 2026-11-20 (or sooner if OSV withdraws the advisory).
"""

