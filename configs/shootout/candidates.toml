weight_gb = 73.9
catalogued = false
arch = "MoE, A10B"
thinking_kwarg = "enable_thinking"
role = "challenger"
why = "The M2 family leads open-weight agentic benchmarks as of mid-2026; the REAP-pruned mxfp4 build is the only M2 variant under the weight ceiling. Largest model on the slate."

[[candidate]]
