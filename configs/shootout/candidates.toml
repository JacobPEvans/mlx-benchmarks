weight_gb = 44.8
catalogued = false
arch = "qwen3_next MoE, A3B, hybrid attention"
thinking_kwarg = "enable_thinking"
role = "challenger"
why = "Coder-tuned sibling of the incumbent on identical architecture, so its serving flags are already known (paged cache off for qwen3_next). Isolates tuning from architecture against candidate 1."

