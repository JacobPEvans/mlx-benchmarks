# Agent-brain shootout — candidate slate.
#
# The question: which single model, running ALONE on the Studio, is the most
# accurate brain for an autonomous agent that makes MCP tool calls, reads the
# results, and writes factual digests. Procedure: docs/shootout.md.
#
# Physical model ids live here (and in the nix-ai catalog) — never in a nix
# module option or option example, which a CI check rejects.
#
# weight_gb is the MEASURED sum of every *.safetensors blob in the HF repo,
# queried 2026-07-24 via the public metadata API:
#   curl -s "https://huggingface.co/api/models/<id>?blobs=true" \
#     | jq '[.siblings[]|select(.rfilename|test("safetensors$")).size]|add'
# It is the download footprint, which runs a little above the resident weight
# figures in nix-ai's catalog (that catalog records observed residency). Sizing
# on the larger of the two is the safe direction.

[fit]
# Studio jevans-ms: 128 GB unified, iogpu wired limit 104000 MiB (~109 GB
# decimal), set in nix-darwin hosts/mac-studio/default.nix.
wired_limit_mb = 104000
# Measured Metal allocation wall at --gpu-memory-utilization 0.80, from the
# 2026-07-09 flagship session (RANKINGS.md "Flagship investigation").
metal_alloc_ceiling_gb = 92
# Weight ceiling for the slate. Leaves ~17 GB over the Metal wall for the KV
# cache, the framework, and the model's own activation scratch. A 64K-token KV
# cache is ~1.6 GB on a qwen3_next-class hybrid and ~6 GB on a dense 70B, so the
# headroom is sized for the dense worst case, not the cheap MoE case.
weight_ceiling_gb = 75
# One model resident at a time, one request in flight — the 40B+ single-slot
# policy the catalog already enforces. The shootout measures single-user
# behavior, so it never drives concurrency above 1.
concurrency = 1

# ---------------------------------------------------------------------------
# Slate — 11 models. `catalogued` means the id already has validated serve args
# in nix-ai modules/mlx/catalog-data.nix, so it costs no new parser research.
# ---------------------------------------------------------------------------

[[candidate]]
id = "mlx-community/Qwen3-Next-80B-A3B-Instruct-4bit"
quant = "4-bit"
weight_gb = 44.8
catalogued = true
arch = "qwen3_next MoE, A3B, hybrid attention"
thinking_kwarg = "enable_thinking"
role = "baseline-incumbent"
why = "The model actually serving as the Studio's resident fleet brain today. Every other candidate has to beat what is already deployed, so it anchors the slate."

[[candidate]]
id = "mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit"
quant = "4-bit"
weight_gb = 17.2
catalogued = true
arch = "qwen3_moe MoE, A3B, standard attention"
thinking_kwarg = "enable_thinking"
role = "baseline-requested"
why = "Currently the swap-class coding model. Its 2026-07-08 agentic result was 0-67% valid with round-1 multi-turn collapse; re-running it holds the floor of the slate honest and re-tests that result under the verdict policy."

[[candidate]]
