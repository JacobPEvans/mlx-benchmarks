# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Light-tier routing comparison suite.
#
# Compares the two small models the LLM fabric routes cheap/low-latency traffic
# to (hermes-4-14b vs qwen3-4b) so routing-policy tuning has evidence: which
# light model handles the short, structured, everyday prompts well enough to be
# the default, and where a request should escalate to a flagship instead.
#
# Endpoints are env-parameterized (public repo — no committed FQDNs/domains):
#
#   PROMPTFOO_BASE_URL   OpenAI-compatible gateway (LiteLLM router / Bifrost)
#   PROMPTFOO_API_KEY    gateway API key
#   PROMPTFOO_JUDGE_MODEL grading model alias (default: gpt-oss-120b — the judge
#                        should be STRONGER than the models under test)
#
# Run:
#   PROMPTFOO_BASE_URL=... PROMPTFOO_API_KEY=... \
#     npx promptfoo@latest eval -c configs/promptfoo/light-tier.yaml \
#     --no-cache -o light-tier-output.json

description: Light-tier routing comparison — hermes-4-14b vs qwen3-4b on short structured prompts

providers:
  - id: openai:chat:hermes-4-14b
    label: light-hermes-4-14b
    config:
      apiBaseUrl: "{{ env.PROMPTFOO_BASE_URL }}"
      apiKey: "{{ env.PROMPTFOO_API_KEY }}"
      temperature: 0
  - id: openai:chat:qwen3-4b
    label: light-qwen3-4b
    config:
      apiBaseUrl: "{{ env.PROMPTFOO_BASE_URL }}"
      apiKey: "{{ env.PROMPTFOO_API_KEY }}"
      temperature: 0

# Grade with a stronger flagship so the light models are scored by a model that
# is not itself under test. Same gateway, temperature pinned for reproducibility.
defaultTest:
  options:
    provider:
      id: "openai:chat:{{ env.PROMPTFOO_JUDGE_MODEL | default('gpt-oss-120b') }}"
      label: local-judge
      config:
        apiBaseUrl: "{{ env.PROMPTFOO_BASE_URL }}"
        apiKey: "{{ env.PROMPTFOO_API_KEY }}"
        temperature: 0

prompts:
  - "{{ prompt }}"

tests:
  - description: structured — extract JSON from text
    vars:
      prompt: |
        Extract the order id and total from this text as JSON with keys
        "order_id" (string) and "total" (number), no other keys and no prose:
        "Order AB-9931 shipped; the charged total was $42.50."
    assert:
      - type: is-json
      - type: contains
        value: "AB-9931"
      - type: llm-rubric
        value: >
          The output is a single JSON object with exactly order_id="AB-9931" and
          total=42.5 and no extra keys or surrounding prose.
        metric: structured_extraction

  - description: classification — pick one label
    vars:
      prompt: |
        Classify the sentiment of this review as exactly one word — positive,
        negative, or neutral — and output only that word:
        "The setup was fiddly but it works fine now."
    assert:
      - type: llm-rubric
        value: >
          The response is exactly one of positive/negative/neutral (neutral is
          the best answer here) with no extra words or punctuation.
        metric: classification_accuracy

  - description: instruction-following — respect a hard constraint
    vars:
      prompt: |
        Summarize the water cycle in exactly two sentences. Do not exceed two
        sentences.
    assert:
      - type: llm-rubric
        value: >
          The summary is accurate AND is exactly two sentences — no more, no
          fewer. Score 0 if it exceeds two sentences.
        metric: instruction_following
