# ARC-Challenge chat variant for models served over local-chat-completions.
#
# Differences from the stock arc_challenge_chat:
#  - gen_prefix removed: the chat-completions API does not support partial-
#    assistant prefilling, so the model emits the whole sentence
#    ("The best answer is C") instead of just the letter. Stock scores every
#    correct answer as wrong -> a flat 0.0 exact_match (same root cause as the
#    humaneval/mbpp overlays in this directory).
#  - regex filter extracts the answer letter from the full sentence, replacing
#    the stock remove_whitespace filter.
#  - until: [] + max_gen_toks 4096 so thinking models can finish; the stock "."
#    stop sequence truncates mid-reasoning and the "\n\n" stop fires inside a
#    <think> block.
task: arc_challenge_chat_qwen3
dataset_path: allenai/ai2_arc
dataset_name: ARC-Challenge
output_type: generate_until
training_split: train
validation_split: validation
test_split: test
fewshot_split: train
doc_to_text: 'Given the following question and four candidate answers (A, B, C and D), choose the best answer.\nQuestion: {{question.strip()}}\nA. {{choices.text[0]}}\nB. {{choices.text[1]}}\nC. {{choices.text[2]}}{% if choices.text|length > 3 %}\nD. {{choices.text[3]}}{% endif %}\nYour response should end with "The best answer is [the_answer_letter]" where the [the_answer_letter] is one of A, B, C or D.'
fewshot_delimiter: "\n\n"
doc_to_target: "{{ 'ABCD'[answerKey|int - 1] if answerKey|string in '1234' else answerKey }}"
num_fewshot: 0
generation_kwargs:
  max_gen_toks: 4096
  until: []
  do_sample: false
filter_list:
  - name: extract_letter
    filter:
      # group_select -1 takes the LAST match, so a model that reasons aloud
      # ("... so it is not A ... The best answer is C") still scores its final
      # answer rather than a letter mentioned mid-reasoning.
      - function: regex
        regex_pattern: '(?:[Tt]he best answer is|[Aa]nswer(?: is)?:?)\s*\**\(?([A-D])\)?'
        group_select: -1
        fallback: "[invalid]"
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
