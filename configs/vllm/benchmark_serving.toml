# Passed to vllm.entrypoints.benchmark_serving for a throughput cross-check.
#
# Usage (per model):
#   python -m vllm.entrypoints.benchmark_serving \
#     --base-url http://localhost:11434 \
#     --model $MODEL \
#     --num-prompts 100 \
#     --input-len 256 \
#     --output-len 256
#
# The sweep runner may override model, base_url, and input_len per invocation.
# Local models only — cloud endpoints not measured for throughput.

base_url = "http://localhost:11434"
input_len = 256
output_len = 256
num_prompts = 100
# Concurrency guard (trap 11): never drive above the endpoint's llama-swap
# concurrencyLimit — excess requests 429 and cascade the client. 4 matches
# the current limit (nix-ai#1190); vllm-mlx bench-serve's flag is
# --concurrency (verified against the installed 0.4.0 CLI). Fire one warm-up
# request before the measured run (trap 12: first request carries cold-load cost).
concurrency = 4
